# Publishes the website in site/ on GitHub Pages (https://dlehmann.github.io/edith/), with the
# screenshots from docs/screenshots/ (made by tools/screenshots.py) and the icon.
name: Pages

on:
  push:
    branches: [master]
    paths: ["site/**", "docs/screenshots/*.png", "packaging/share/edith.svg", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # GitHub Pages needs a public repository (or a paid plan)
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site/screenshots
          cp site/index.html site/impressum.html _site/
          cp docs/screenshots/*.png _site/screenshots/
          cp packaging/share/edith.svg _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
